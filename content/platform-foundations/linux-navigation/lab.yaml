version: 1
id: linux-navigation
title: Linux Navigation and Permissions
summary: Repair a deploy script's mode and pull the error lines out of a short log.
difficulty: beginner
estimatedMinutes: 20
prerequisites: []
image: alpine:3.21
shell: /bin/sh
setup:
  - mkdir -p /workspace/releases /workspace/logs
  - printf '#!/bin/sh\necho deployed\n' > /workspace/releases/deploy.sh
  - chmod 0644 /workspace/releases/deploy.sh
  - printf 'INFO ready\nERROR disk\nERROR timeout\n' > /workspace/logs/app.log
tasks:
  - id: executable
    title: Restore the deployment command
    description: Make /workspace/releases/deploy.sh executable without making it world-writable. Modes 755, 750, 744, and 700 pass. Modes 644 and 777 do not.
    hints:
      - Inspect the current mode with ls -l /workspace/releases/deploy.sh.
      - "chmod u+x turns the original 644 file into 744, which passes. chmod 755 also passes."
      - "Do not use 777. A world-writable script fails the check."
    checks:
      - type: command
        name: Deployment script is executable
        command: "test $((0$(stat -c %a /workspace/releases/deploy.sh) & 0111)) -ne 0"
      - type: command
        name: Deployment script is not world-writable
        command: "test $((0$(stat -c %a /workspace/releases/deploy.sh) & 0002)) -eq 0"
  - id: pipeline
    title: Extract incident signals
    description: 'Write /workspace/errors.txt with exactly two lines from /workspace/logs/app.log: "ERROR disk" and "ERROR timeout". Leave the INFO line out.'
    hints:
      - grep can select lines by a fixed word, then redirect the output into errors.txt.
      - "The file must contain exactly two lines: ERROR disk and ERROR timeout."
    checks:
      - type: command
        name: Disk error recorded
        command: "grep -qx 'ERROR disk' /workspace/errors.txt"
      - type: command
        name: Timeout error recorded
        command: "grep -qx 'ERROR timeout' /workspace/errors.txt"
      - type: command
        name: Error report has two lines
        command: 'test -f /workspace/errors.txt && test "$(wc -l < /workspace/errors.txt)" -eq 2'
limits: {cpus: "0.5", memory: 128m, pids: 64, timeout: 1800, network: false}
