version: 1
id: linux-filesystems
title: Filesystem Discovery
summary: Find large files and document disk usage patterns before a node runs out of space.
difficulty: beginner
estimatedMinutes: 20
prerequisites: [linux-pipelines]
image: alpine:3.21
shell: /bin/sh
setup:
  - "mkdir -p /workspace/data/cache /workspace/data/archive"
  - "dd if=/dev/zero of=/workspace/data/cache/temp.bin bs=1M count=5 2>/dev/null"
  - "dd if=/dev/zero of=/workspace/data/archive/backup.bin bs=1M count=2 2>/dev/null"
  - "printf 'small\n' > /workspace/data/readme.txt"
tasks:
  - id: disk-audit
    title: Audit workspace usage
    description: 'Save du -sh /workspace/data to /workspace/disk-audit.txt. Write /workspace/large-files.txt with every regular file under /workspace/data larger than 1 MiB: cache/temp.bin and archive/backup.bin. Leave readme.txt out. Alpine find rejects -size +1M; use -size +1024k.'
    hints:
      - "du -sh /workspace/data prints a size in megabytes and the directory path. Redirect that line into disk-audit.txt."
      - "BusyBox find rejects +1M with invalid number. Use find /workspace/data -type f -size +1024k"
      - "+1024k means larger than 1024 KiB. temp.bin and backup.bin match; readme.txt does not."
    checks:
      - type: file
        name: Disk audit exists
        path: /workspace/disk-audit.txt
      - type: command
        name: Audit mentions data directory
        command: grep -q data /workspace/disk-audit.txt
      - type: command
        name: Audit includes a size
        command: grep -Eq '[0-9]' /workspace/disk-audit.txt
      - type: command
        name: Temp file listed
        command: grep -q temp.bin /workspace/large-files.txt
      - type: command
        name: Backup file listed
        command: grep -q backup.bin /workspace/large-files.txt
      - type: command
        name: Small file excluded
        command: test -f /workspace/large-files.txt && ! grep -q readme.txt /workspace/large-files.txt
limits: {cpus: "0.5", memory: 128m, pids: 64, timeout: 1800, network: false}
