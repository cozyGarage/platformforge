version: 1
id: linux-shell-basics
title: Linux Shell and File Basics
summary: Practice core terminal skills—navigation, file creation, and output redirection—in an isolated environment.
difficulty: beginner
estimatedMinutes: 20
prerequisites: []
image: alpine:3.21
shell: /bin/sh
setup:
  - "mkdir -p /workspace/inbox"
  - "printf 'Onboarding ticket\\nCreate /workspace/notes.txt so it contains the word platformforge.\\nThe logs directory does not exist yet. Create /workspace/logs and copy the note to /workspace/logs/notes.bak.\\n' > /workspace/inbox/TICKET.md"
tasks:
  - id: navigation
    title: Explore and organize files
    description: Create /workspace/notes.txt containing the word platformforge. Output redirection is the usual way. The logs directory is not created for you — mkdir /workspace/logs and copy the note to /workspace/logs/notes.bak.
    hints:
      - "pwd and ls show where you are. Paths that start with / do not depend on the current directory."
      - "printf 'platformforge\\n' > /workspace/notes.txt writes the file with redirection."
      - "mkdir /workspace/logs && cp /workspace/notes.txt /workspace/logs/notes.bak"
    checks:
      - type: file
        name: notes.txt exists
        path: /workspace/notes.txt
        value: platformforge
      - type: file
        name: backup exists
        path: /workspace/logs/notes.bak
        value: platformforge
      - type: command
        name: logs directory present
        command: test -d /workspace/logs
limits: {cpus: "0.5", memory: 128m, pids: 64, timeout: 1800, network: false}
attribution: "Adapted from 90DaysOfDevOps Linux fundamentals (Michael Cade, CC BY-NC-SA 4.0). Rewritten as an interactive PlatformForge scenario."
